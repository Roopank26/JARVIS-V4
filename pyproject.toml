[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jarvis-v4"
version = "1.0.0"
description = "JARVIS-V4 - Just A Rather Very Intelligent System. A cross-platform personal AI assistant with voice, vision, and automation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "JARVIS Team" }
]
keywords = [
    "ai",
    "assistant",
    "jarvis",
    "voice",
    "automation",
    "llm",
    "groq",
    "ollama",
    "rag",
    "multimodal",
    "desktop",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "groq>=0.4.0",
    "sounddevice>=0.4.0",
    "gTTS>=2.4.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "openwakeword>=0.5.0",
    "piper-tts>=1.2.0",
]
local-ai = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "ollama>=0.1.0",
]
rag = [
    "chromadb>=0.4.0",
    "pypdf2>=3.0.0",
    "python-docx>=1.0.0",
    "markdown>=3.5.0",
]
all = [
    "jarvis-v4[dev,voice,local-ai,rag]",
]

[project.urls]
Homepage = "https://github.com/Roopank26/JARVIS-V4"
Repository = "https://github.com/Roopank26/JARVIS-V4"
Documentation = "https://github.com/Roopank26/JARVIS-V4#readme"
"Bug Tracker" = "https://github.com/Roopank26/JARVIS-V4/issues"

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-doctor = "jarvis.diagnostics:run_jarvis_doctor"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
