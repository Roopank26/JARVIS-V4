name: CI

on:
  push:
    branches: [ main, master, feature/rag-pdf ]
  pull_request:
    branches: [ main, master, feature/rag-pdf ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2 libportaudiocpp0 ffmpeg libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff black

      - name: Lint with Ruff
        run: ruff check jarvis/ tests/

      - name: Check formatting with Black
        run: black --check jarvis/ tests/

      - name: Run tests
        run: pytest tests/ -q

      - name: Verify imports
        run: |
          python -c "import jarvis; print(f'JARVIS {jarvis.__version__} imported OK')"
          python -c "from jarvis.core.agent import JarvisAgent; print('Agent OK')"
          python -c "from jarvis.voice.voice_router import VoiceRouter; print('Voice OK')"
          python -c "from jarvis.memory.enhanced import EnhancedMemoryManager; print('Memory OK')"
          python -c "from jarvis.rag.rag_system import RAGSystem; print('RAG OK')"
          python -c "from jarvis.plugins.plugin_manager import PluginManager; print('Plugins OK')"
          python -c "from jarvis.integrations.vscode import VSCodeBridge; print('Integrations OK')"
          python -c "from jarvis.research.research_agent import ResearchAgent; print('Research OK')"

  lint:
    name: Lint Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install ruff black
      - run: ruff check jarvis/ tests/
      - run: black --check jarvis/ tests/
